services:
  # -------------------------------------------------------
  # Streamlit Dashboard
  # -------------------------------------------------------
  dashboard:
    build: .
    container_name: ipo-radar-dashboard
    command: >
      streamlit run src/dashboard/app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # -------------------------------------------------------
  # Scheduler (periodic scanning + Feishu notifications)
  # -------------------------------------------------------
  scheduler:
    build: .
    container_name: ipo-radar-scheduler
    command: python -m src.scheduler
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # No healthcheck — long-running background loop

  # -------------------------------------------------------
  # Ollama - Local LLM for sentiment analysis (optional)
  # Activate with:  docker compose --profile gpu up -d
  #            or:  docker compose --profile cpu up -d
  # -------------------------------------------------------
  ollama-gpu:
    image: ollama/ollama:latest
    container_name: ipo-radar-ollama
    profiles: ["gpu"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-cpu:
    image: ollama/ollama:latest
    container_name: ipo-radar-ollama
    profiles: ["cpu"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
